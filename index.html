<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IEADPIB | Calendário de Eventos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F9FAFB;
            color: #111827;
            min-height: 100vh;
        }
        .card-shadow { box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px 0 rgba(0, 0, 0, 0.03); }
        .modal-shadow { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        /* Esconder scrollbar mantendo funcionalidade */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="antialiased">

    <div id="modal-overlay" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white rounded-3xl w-full max-w-4xl max-h-[90vh] overflow-y-auto modal-shadow flex flex-col md:flex-row relative">
            <button onclick="fecharModal()" class="absolute top-4 right-4 p-2 bg-gray-100 hover:bg-gray-200 rounded-full text-gray-600 transition-colors z-10">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>

            <div class="p-8 md:p-12 flex-1 flex flex-col justify-center order-2 md:order-1">
                <h2 id="modal-titulo" class="text-3xl md:text-4xl font-black text-gray-950 mb-6 leading-tight">Nome do Evento</h2>
                
                <div class="space-y-4 mb-8">
                    <p class="text-gray-600 font-semibold flex items-center gap-3 text-lg">
                        <i data-lucide="calendar" class="w-6 h-6 text-blue-600"></i>
                        Data: <span id="modal-data" class="text-gray-900">00/00/0000</span>
                    </p>
                    <p class="text-gray-600 font-semibold flex items-center gap-3 text-lg">
                        <i data-lucide="clock" class="w-6 h-6 text-blue-600"></i>
                        Horário: <span id="modal-hora" class="text-gray-900">00:00h</span>
                    </p>
                    <p class="text-gray-600 font-semibold flex items-center gap-3 text-lg">
                        <i data-lucide="map-pin" class="w-6 h-6 text-blue-600"></i>
                        Local: <span id="modal-local" class="text-gray-900">Localização</span>
                    </p>
                </div>

                <div>
                    <h3 class="font-bold text-gray-900 mb-2 text-lg">Descrição:</h3>
                    <p id="modal-desc" class="text-gray-600 leading-relaxed">
                        Descrição detalhada do evento aparecerá aqui.
                    </p>
                </div>
            </div>

            <div class="w-full md:w-2/5 bg-gray-100 flex items-center justify-center order-1 md:order-2 overflow-hidden rounded-t-3xl md:rounded-tr-3xl md:rounded-l-none border-b md:border-b-0 md:border-l border-gray-200">
                <img id="modal-imagem" src="" alt="Cartaz do Evento" class="w-full h-64 md:h-full object-cover">
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto p-6 md:p-12">
        
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-12 gap-6 pb-6 border-b border-gray-200">
            <div>
                <h1 class="text-3xl font-black tracking-tight text-gray-950">IEADPIB</h1>
                <p class="text-gray-500 font-bold text-sm uppercase tracking-widest mt-1">Calendário de Eventos</p>
            </div>
            <button id="btn-toggle-view" onclick="alternarTela()" class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-xl font-bold text-sm transition-all active:scale-95 flex items-center justify-center gap-2.5">
                <i data-lucide="layout-grid" class="w-5 h-5"></i> <span id="texto-btn-view">VER TODOS EVENTOS</span>
            </button>
        </header>

        <div id="tela-home" class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-start">
            
            <section class="lg:col-span-5 order-1 lg:order-2">
                <div class="bg-white rounded-3xl p-8 card-shadow border border-gray-100">
                    <div class="flex justify-between items-center mb-8 pb-4 border-b border-gray-50">
                        <h2 id="mes-ano-texto" class="text-2xl font-black text-gray-900 capitalize">Mês Ano</h2>
                        <div class="flex gap-2">
                            <button onclick="mudarMes(-1)" class="p-3 bg-gray-50 hover:bg-gray-100 rounded-xl transition-all border border-gray-100 text-gray-600 active:scale-95">
                                <i data-lucide="chevron-left" class="w-5 h-5"></i>
                            </button>
                            <button onclick="mudarMes(1)" class="p-3 bg-gray-50 hover:bg-gray-100 rounded-xl transition-all border border-gray-100 text-gray-600 active:scale-95">
                                <i data-lucide="chevron-right" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                    <div class="grid grid-cols-7 mb-4">
                        <div class="text-center text-xs font-bold text-blue-600 uppercase">Dom</div>
                        <div class="text-center text-xs font-bold text-gray-400 uppercase">Seg</div>
                        <div class="text-center text-xs font-bold text-gray-400 uppercase">Ter</div>
                        <div class="text-center text-xs font-bold text-gray-400 uppercase">Qua</div>
                        <div class="text-center text-xs font-bold text-gray-400 uppercase">Qui</div>
                        <div class="text-center text-xs font-bold text-gray-400 uppercase">Sex</div>
                        <div class="text-center text-xs font-bold text-gray-400 uppercase">Sáb</div>
                    </div>
                    <div id="grade-dias" class="grid grid-cols-7 gap-1"></div>
                </div>
            </section>

            <section class="lg:col-span-7 order-2 lg:order-1">
                <div class="flex items-center justify-between mb-8 pb-4 border-b border-gray-100">
                    <h3 class="text-2xl font-black text-gray-950 flex items-center gap-3">
                        <i data-lucide="calendar-days" class="w-7 h-7 text-blue-600"></i>
                        Eventos desse mês
                    </h3>
                </div>
                <div id="lista-eventos-mes" class="space-y-4"></div>
            </section>
        </div>

        <div id="tela-todos" class="hidden">
            <div class="bg-white p-6 md:p-8 rounded-3xl card-shadow border border-gray-100 mb-8 flex flex-col md:flex-row justify-between items-center gap-6">
                <h2 class="text-2xl font-black text-gray-900 flex items-center gap-3">
                    <i data-lucide="list" class="w-7 h-7 text-blue-600"></i>
                    Todos os Eventos
                </h2>
                
                <div class="w-full md:w-auto flex items-center gap-4">
                    <label for="filtro-data" class="font-bold text-gray-600 text-sm">Filtrar a partir de:</label>
                    <input type="date" id="filtro-data" onchange="renderizarTodosEventos()" class="bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-xl focus:ring-blue-500 focus:border-blue-500 block p-3 font-semibold">
                </div>
            </div>

            <div id="grid-todos-eventos" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"></div>
        </div>

    </div>

    <script>
        // --- 1. BANCO DE DADOS (MOCK) ---
        // Futuramente, isso virá do Supabase.
        const eventosDB = [
            {
                id: 1,
                titulo: "Culto de Ensino",
                dataStr: "2026-03-25", // Formato ISO YYYY-MM-DD facilita ordenação
                hora: "19:30h",
                local: "Templo Central, Pimenta Bueno",
                descricao: "Venha participar de um culto poderoso com ensino da Palavra e muito louvor. Convide sua família!",
                imagem: "https://images.unsplash.com/photo-1438232992991-995b7058bbb3?q=80&w=800&auto=format&fit=crop"
            },
            {
                id: 2,
                titulo: "Congresso UMADEPIB",
                dataStr: "2026-03-28",
                hora: "19:00h",
                local: "Ginásio Municipal",
                descricao: "Grande congresso de jovens da nossa região. Preletores convidados e cantores locais. A entrada é franca.",
                imagem: "https://images.unsplash.com/photo-1510511459019-5efa3cae14dc?q=80&w=800&auto=format&fit=crop"
            },
            {
                id: 3,
                titulo: "Santa Ceia do Senhor",
                dataStr: "2026-04-05",
                hora: "18:30h",
                local: "Templo Central",
                descricao: "Nosso culto de adoração e comunhão com a igreja. Um momento sagrado de renovação.",
                imagem: "https://images.unsplash.com/photo-1544427920-c49ccfaf8c56?q=80&w=800&auto=format&fit=crop"
            }
        ];

        // --- 2. VARIÁVEIS DE ESTADO ---
        const mesesNomes = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
        let dataAtualExibida = new Date(2026, 2, 1); // Março de 2026 (Mês 2 no JS)
        const hoje = new Date(); // Data real de hoje

        // --- 3. LÓGICA DO CALENDÁRIO ---
        function renderizarCalendario() {
            const ano = dataAtualExibida.getFullYear();
            const mes = dataAtualExibida.getMonth();
            
            document.getElementById('mes-ano-texto').innerText = `${mesesNomes[mes]} ${ano}`;

            const primeiroDiaDoMes = new Date(ano, mes, 1).getDay();
            const ultimoDiaDoMes = new Date(ano, mes + 1, 0).getDate();
            const ultimoDiaMesAnterior = new Date(ano, mes, 0).getDate();

            const grade = document.getElementById('grade-dias');
            grade.innerHTML = '';

            // Renderiza dias do mês anterior
            for (let i = primeiroDiaDoMes; i > 0; i--) {
                grade.innerHTML += `<div class="aspect-square flex items-center justify-center text-gray-300 font-medium text-sm">${ultimoDiaMesAnterior - i + 1}</div>`;
            }

            // Renderiza dias do mês atual
            for (let dia = 1; dia <= ultimoDiaDoMes; dia++) {
                const dataLoopStr = `${ano}-${String(mes + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
                
                // Verifica se há evento neste dia
                const eventosDoDia = eventosDB.filter(ev => ev.dataStr === dataLoopStr);
                const temEvento = eventosDoDia.length > 0;
                
                // Verifica se é hoje
                const ehHoje = dia === hoje.getDate() && mes === hoje.getMonth() && ano === hoje.getFullYear();

                let classes = "aspect-square flex flex-col items-center justify-center rounded-xl font-bold text-sm cursor-pointer transition-all active:scale-95 ";
                let dotHTML = "";
                let onClickEvent = temEvento ? `onclick="abrirModal(${eventosDoDia[0].id})"` : "";

                if (ehHoje) {
                    classes += "bg-blue-600 text-white shadow-md hover:bg-blue-700 ";
                    if (temEvento) dotHTML = `<span class="w-1.5 h-1.5 rounded-full bg-white mt-1 opacity-80"></span>`;
                } else if (temEvento) {
                    classes += "text-gray-900 hover:bg-gray-50 border-2 border-gray-100 ";
                    dotHTML = `<span class="w-1.5 h-1.5 rounded-full bg-blue-600 mt-1"></span>`;
                } else {
                    classes += "text-gray-700 hover:bg-gray-100 ";
                }

                grade.innerHTML += `
                    <div class="${classes}" ${onClickEvent}>
                        <span>${dia}</span>
                        ${dotHTML}
                    </div>
                `;
            }

            // Preenche o resto da grade (próximo mês)
            const totalCelulas = primeiroDiaDoMes + ultimoDiaDoMes;
            const celulasRestantes = 42 - totalCelulas; // 6 semanas * 7 dias = 42

            for (let j = 1; j <= celulasRestantes; j++) {
                grade.innerHTML += `<div class="aspect-square flex items-center justify-center text-gray-300 font-medium text-sm">${j}</div>`;
            }

            renderizarEventosDoMes();
            lucide.createIcons();
        }

        function mudarMes(direcao) {
            dataAtualExibida.setMonth(dataAtualExibida.getMonth() + direcao);
            renderizarCalendario();
        }

        // --- 4. LISTA DE EVENTOS DO MÊS ---
        function renderizarEventosDoMes() {
            const ano = dataAtualExibida.getFullYear();
            const mes = dataAtualExibida.getMonth() + 1; // +1 porque Janeiro é 0 no JS

            // Filtra eventos que pertencem ao mês e ano exibidos
            const eventosFiltrados = eventosDB.filter(ev => {
                const [evAno, evMes] = ev.dataStr.split('-');
                return parseInt(evAno) === ano && parseInt(evMes) === mes;
            });

            // Ordena por dia
            eventosFiltrados.sort((a, b) => new Date(a.dataStr) - new Date(b.dataStr));

            const container = document.getElementById('lista-eventos-mes');
            container.innerHTML = '';

            if (eventosFiltrados.length === 0) {
                container.innerHTML = `
                    <div class="text-center p-8 bg-gray-50 rounded-2xl border border-dashed border-gray-200">
                        <i data-lucide="calendar-x" class="w-10 h-10 text-gray-400 mx-auto mb-3"></i>
                        <p class="text-gray-500 font-bold">Nenhum evento programado para este mês.</p>
                    </div>`;
                return;
            }

            eventosFiltrados.forEach(ev => {
                const diaStr = ev.dataStr.split('-')[2];
                container.innerHTML += `
                    <div onclick="abrirModal(${ev.id})" class="bg-white p-5 md:p-6 rounded-2xl border border-gray-100 card-shadow hover:border-blue-200 transition-all cursor-pointer flex items-center gap-5 md:gap-6 group active:scale-[0.98]">
                        <div class="bg-gray-50 group-hover:bg-blue-50 w-20 h-20 md:w-24 md:h-24 rounded-2xl flex flex-col items-center justify-center border border-gray-100 group-hover:border-blue-100 flex-shrink-0 transition-colors">
                            <span class="text-[10px] md:text-xs font-bold text-gray-400 uppercase tracking-wider group-hover:text-blue-500">${mesesNomes[mes-1].substring(0,3)}</span>
                            <span class="text-3xl md:text-4xl font-black text-gray-900 group-hover:text-blue-600">${diaStr}</span>
                        </div>
                        <div class="flex-1">
                            <h4 class="font-black text-lg md:text-xl text-gray-950 mb-2 leading-tight group-hover:text-blue-600 transition-colors">${ev.titulo}</h4>
                            <div class="flex flex-col gap-1 text-gray-600 font-semibold text-sm">
                                <span class="flex items-center gap-2"><i data-lucide="map-pin" class="w-4 h-4 text-blue-500"></i> ${ev.local}</span>
                                <span class="flex items-center gap-2"><i data-lucide="clock" class="w-4 h-4 text-blue-500"></i> ${ev.hora}</span>
                            </div>
                        </div>
                        <div class="text-gray-300 group-hover:text-blue-500 transition-colors mr-2 hidden sm:block">
                            <i data-lucide="chevron-right" class="w-8 h-8"></i>
                        </div>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        // --- 5. TELA "TODOS OS EVENTOS" ---
        function renderizarTodosEventos() {
            const dataFiltro = document.getElementById('filtro-data').value;
            let eventosFiltrados = [...eventosDB]; // Copia do array

            // Se o usuário selecionou uma data, exibe apenas eventos a partir dessa data
            if (dataFiltro) {
                eventosFiltrados = eventosFiltrados.filter(ev => new Date(ev.dataStr) >= new Date(dataFiltro));
            }

            // Ordena do mais próximo para o mais distante
            eventosFiltrados.sort((a, b) => new Date(a.dataStr) - new Date(b.dataStr));

            const grid = document.getElementById('grid-todos-eventos');
            grid.innerHTML = '';

            if (eventosFiltrados.length === 0) {
                grid.innerHTML = `<p class="text-gray-500 font-bold col-span-full text-center py-10">Nenhum evento encontrado.</p>`;
                return;
            }

            eventosFiltrados.forEach(ev => {
                const [ano, mes, dia] = ev.dataStr.split('-');
                grid.innerHTML += `
                    <div onclick="abrirModal(${ev.id})" class="bg-white rounded-3xl border border-gray-100 card-shadow hover:shadow-lg transition-all cursor-pointer overflow-hidden group flex flex-col">
                        <div class="h-48 overflow-hidden relative">
                            <img src="${ev.imagem}" alt="Cartaz" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                            <div class="absolute top-4 left-4 bg-white/95 backdrop-blur px-3 py-2 rounded-xl flex flex-col items-center shadow-sm">
                                <span class="text-[10px] font-bold text-gray-500 uppercase">${mesesNomes[parseInt(mes)-1].substring(0,3)}</span>
                                <span class="text-xl font-black text-blue-600 leading-none">${dia}</span>
                            </div>
                        </div>
                        <div class="p-6 flex-1 flex flex-col">
                            <h4 class="font-black text-xl text-gray-950 mb-3 group-hover:text-blue-600 transition-colors">${ev.titulo}</h4>
                            <p class="text-gray-500 text-sm font-medium mb-4 line-clamp-2">${ev.descricao}</p>
                            <div class="mt-auto space-y-2 text-sm font-semibold text-gray-600">
                                <span class="flex items-center gap-2"><i data-lucide="map-pin" class="w-4 h-4 text-blue-500"></i> ${ev.local}</span>
                                <span class="flex items-center gap-2"><i data-lucide="clock" class="w-4 h-4 text-blue-500"></i> ${ev.hora}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        // --- 6. NAVEGAÇÃO DE TELAS ---
        let telaAtual = 'home';
        function alternarTela() {
            const telaHome = document.getElementById('tela-home');
            const telaTodos = document.getElementById('tela-todos');
            const btn = document.getElementById('btn-toggle-view');
            const textoBtn = document.getElementById('texto-btn-view');

            if (telaAtual === 'home') {
                telaHome.classList.add('hidden');
                telaTodos.classList.remove('hidden');
                btn.classList.replace('bg-blue-600', 'bg-gray-800');
                btn.classList.replace('hover:bg-blue-700', 'hover:bg-gray-900');
                textoBtn.innerText = 'VOLTAR AO CALENDÁRIO';
                btn.innerHTML = `<i data-lucide="arrow-left" class="w-5 h-5"></i> <span id="texto-btn-view">VOLTAR AO CALENDÁRIO</span>`;
                telaAtual = 'todos';
                renderizarTodosEventos();
            } else {
                telaTodos.classList.add('hidden');
                telaHome.classList.remove('hidden');
                btn.classList.replace('bg-gray-800', 'bg-blue-600');
                btn.classList.replace('hover:bg-gray-900', 'hover:bg-blue-700');
                btn.innerHTML = `<i data-lucide="layout-grid" class="w-5 h-5"></i> <span id="texto-btn-view">VER TODOS EVENTOS</span>`;
                telaAtual = 'home';
                renderizarCalendario(); // Recarrega o estado inicial
            }
            lucide.createIcons();
        }

        // --- 7. LÓGICA DO MODAL ---
        function abrirModal(idEvento) {
            const evento = eventosDB.find(ev => ev.id === idEvento);
            if (!evento) return;

            // Formata data de "YYYY-MM-DD" para "DD/MM/YYYY"
            const [ano, mes, dia] = evento.dataStr.split('-');
            const dataFormatada = `${dia}/${mes}/${ano}`;

            document.getElementById('modal-titulo').innerText = evento.titulo;
            document.getElementById('modal-data').innerText = dataFormatada;
            document.getElementById('modal-hora').innerText = evento.hora;
            document.getElementById('modal-local').innerText = evento.local;
            document.getElementById('modal-desc').innerText = evento.descricao;
            document.getElementById('modal-imagem').src = evento.imagem;

            const modal = document.getElementById('modal-overlay');
            modal.classList.remove('hidden');
            
            // Impede rolagem da página por trás do modal
            document.body.style.overflow = 'hidden';
        }

        function fecharModal() {
            const modal = document.getElementById('modal-overlay');
            modal.classList.add('hidden');
            // Restaura rolagem da página
            document.body.style.overflow = 'auto';
        }

        // Fecha modal se clicar fora do conteúdo
        document.getElementById('modal-overlay').addEventListener('click', function(e) {
            if (e.target === this) fecharModal();
        });

        // --- 8. INICIALIZAÇÃO ---
        renderizarCalendario();
        
    </script>
</body>
</html>
